name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: the fuzz sweep below, and the whole suite against whatever the
    # runners and dependency caches look like that week.
    - cron: "41 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, JDK ${{ matrix.jdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        jdk: ["17", "21"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: gradle/actions/setup-gradle@v4

      # Path handling, file locking and atomic-move behaviour genuinely differ
      # between these platforms, and the save path depends on all three.
      - name: JVM tests
        run: ./gradlew :documentkit-core:jvmTest :documentkit-io:jvmTest :documentkit-cli:test :samples:lantr-import:test --stacktrace

      # A separate invocation because the heap is the assertion: this task
      # launches a JVM with less memory than the asset it streams, so a stage
      # that buffers dies rather than passing quietly.
      - name: Memory ceiling
        run: ./gradlew :documentkit-io:memoryCeilingTest --stacktrace

  android:
    name: android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble Android variants
        run: ./gradlew :documentkit-core:assembleRelease :documentkit-io:assembleRelease :documentkit-android:assembleRelease --stacktrace

      # Storage Access Framework import and export under Robolectric, at API
      # 24 and 36. Runs on a Java 21 toolchain, which Gradle downloads; the
      # JDK set up above still builds the library.
      - name: Android unit tests (Robolectric, API 24 and 36)
        run: ./gradlew :documentkit-android:testDebugUnitTest --stacktrace

  consumer:
    name: consumer build from published artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Publishes to build/test-repo and asserts every expected coordinate is
      # present. A module whose publication stops being registered fails here
      # rather than going quietly missing from the release.
      - name: Publish and verify every expected coordinate
        run: ./gradlew verifyPublishedCoordinates --stacktrace

      # The real gate. Building inside the workspace proves the code compiles;
      # it says nothing about whether the published artifacts are usable.
      # Gradle metadata, target variants, the api/implementation split and
      # transitive dependencies are invisible until something resolves them
      # from an independent build.
      - name: Resolve and run the independent JVM consumer
        working-directory: consumer-check
        run: ./gradlew run --stacktrace

      # A JVM consumer cannot resolve an AAR, so the job above is structurally
      # incapable of noticing an Android packaging failure - which is exactly
      # how documentkit-android came to publish no artifact at all while CI
      # stayed green. Only a build with the Android plugin applied can prove
      # that module resolves and exposes the API it claims to.
      - name: Resolve documentkit-android from an independent Android consumer
        working-directory: consumer-check-android
        run: ./gradlew assembleDebug --stacktrace

  # The search. Every build already runs FuzzTest on a small fixed seed; this
  # runs it with a large budget and a fresh one, and keeps whatever it finds.
  # A finding is fixed, then its input is committed to
  # documentkit-io/src/jvmCommonTest/fuzz-regressions/, where every build
  # replays it.
  fuzz-sweep:
    name: fuzz sweep (random seed)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Fuzz the reader
        run: ./gradlew :documentkit-io:fuzzSweep -PfuzzIterations=200000 --stacktrace

      - name: Keep the findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: documentkit-io/build/fuzz-findings/
          retention-days: 30
