name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, JDK ${{ matrix.jdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        jdk: ["17", "21"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: gradle/actions/setup-gradle@v4

      # Path handling, file locking and atomic-move behaviour genuinely differ
      # between these platforms, and the save path depends on all three.
      - name: JVM tests
        run: ./gradlew :documentkit-core:jvmTest :documentkit-io:jvmTest --stacktrace

  android:
    name: android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble Android variants
        run: ./gradlew :documentkit-core:assembleRelease :documentkit-io:assembleRelease :documentkit-android:assembleRelease --stacktrace

  consumer:
    name: consumer build from published artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to the local repository
        run: ./gradlew publishToMavenLocal --stacktrace

      # The real gate. Building inside the workspace proves the code compiles;
      # it says nothing about whether the published artifacts are usable.
      # Gradle metadata, target variants, the api/implementation split and
      # transitive dependencies are invisible until something resolves them
      # from an independent build.
      - name: Resolve and run the independent consumer
        working-directory: consumer-check
        run: ./gradlew run --stacktrace
